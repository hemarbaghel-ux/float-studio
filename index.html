    <script>
      (function() {
        try {
          var saved = localStorage.getItem('float_theme') || 'dark';
          var resolved = saved;
          if (saved === 'system') {
            resolved = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          if (resolved === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
            document.documentElement.setAttribute('data-theme', 'dark');
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
            document.documentElement.setAttribute('data-theme', 'light');
          }
        } catch (e) {}

        window.addEventListener('unhandledrejection', function(event) {
          try {
            var reason = event.reason;
            var msg = typeof reason === 'string' ? reason : (reason && (reason.message || reason.msg) ? (reason.message || reason.msg) : JSON.stringify(reason || ''));
            if (
              (reason && (reason.type === 'cancelation' || reason.type === 'cancelled' || reason.name === 'AbortError')) ||
              msg.indexOf('operation is manually canceled') !== -1 ||
              msg.indexOf('cancelation') !== -1
            ) {
              event.preventDefault();
              event.stopPropagation();
            }
          } catch (e) {}
        }, true);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
