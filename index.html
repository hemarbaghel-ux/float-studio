    <script>
      (function() {
        try {
          var saved = localStorage.getItem('float_theme') || 'dark';
          var resolved = saved;
          if (saved === 'system') {
            resolved = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          if (resolved === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
            document.documentElement.setAttribute('data-theme', 'dark');
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
            document.documentElement.setAttribute('data-theme', 'light');
          }
        } catch (e) {}

        function isBenignCancellation(reason) {
          if (!reason) return false;
          if (reason.type === 'cancelation' || reason.type === 'cancelled' || reason.name === 'AbortError') return true;
          if (reason.msg === 'operation is manually canceled' || reason.message === 'operation is manually canceled') return true;
          var msg = typeof reason === 'string' ? reason : (reason.message || reason.msg || '');
          if (!msg && typeof reason === 'object') {
            try { msg = JSON.stringify(reason); } catch (_) {}
          }
          return /operation is manually canceled/i.test(msg) || /cancelation/i.test(msg) || /AbortError/i.test(msg);
        }

        window.addEventListener('unhandledrejection', function(event) {
          try {
            if (isBenignCancellation(event.reason)) {
              event.preventDefault();
              event.stopPropagation();
              if (event.stopImmediatePropagation) event.stopImmediatePropagation();
              return true;
            }
          } catch (e) {}
        }, true);

        window.addEventListener('error', function(event) {
          try {
            var err = event.error || event.message;
            if (isBenignCancellation(err) || isBenignCancellation(event.error)) {
              event.preventDefault();
              event.stopPropagation();
              if (event.stopImmediatePropagation) event.stopImmediatePropagation();
              return true;
            }
          } catch (e) {}
        }, true);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
