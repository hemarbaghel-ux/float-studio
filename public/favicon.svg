<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Ambient outer glow -->
    <filter id="outer-neon-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="16" result="blur1" />
      <feGaussianBlur stdDeviation="6" result="blur2" />
      <feColorMatrix type="matrix" values="
        0.2 0 0 0 0.1
        0 0.4 0 0 0.2
        0 0 1.0 0 0.5
        0 0 0 0.6 0" result="glow" />
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Top Bar: brilliant glossy white / icy blue surface -->
    <linearGradient id="topBarGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D1E5FF" />
      <stop offset="15%" stop-color="#E2EFFF" />
      <stop offset="40%" stop-color="#F4F8FF" />
      <stop offset="80%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>

    <!-- Middle Bar: bright icy blue to white surface -->
    <linearGradient id="midBarGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8CB6FF" />
      <stop offset="20%" stop-color="#B5D4FF" />
      <stop offset="55%" stop-color="#E8F2FF" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>

    <!-- Left outer loop curve (continuous ribbon connection) -->
    <linearGradient id="leftLoopGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="25%" stop-color="#E0EEFF" />
      <stop offset="50%" stop-color="#99C4FF" />
      <stop offset="75%" stop-color="#4D8DFF" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>

    <!-- Bottom Tail Ribbon: electric royal blue to violet -->
    <linearGradient id="bottomTailGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E40AF" />
      <stop offset="25%" stop-color="#2563EB" />
      <stop offset="55%" stop-color="#3B82F6" />
      <stop offset="80%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>

    <!-- Inner fold deep dark shadow -->
    <linearGradient id="innerShadowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080E24" />
      <stop offset="40%" stop-color="#0F1E4A" />
      <stop offset="75%" stop-color="#1D3BB5" />
      <stop offset="100%" stop-color="#3B6CF6" />
    </linearGradient>

    <!-- Specular highlight along top bar upper ridge -->
    <linearGradient id="topRidgeHighlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="70%" stop-color="#FFFFFF" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.3" />
    </linearGradient>

    <!-- Specular highlight along middle bar upper ridge -->
    <linearGradient id="midRidgeHighlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#FFFFFF" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.2" />
    </linearGradient>

    <!-- Neon rim light on bottom tail -->
    <linearGradient id="bottomNeonRim" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#93C5FD" stop-opacity="1" />
      <stop offset="60%" stop-color="#60A5FA" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.1" />
    </linearGradient>

    <!-- Soft diffuse halo behind the emblem -->
    <radialGradient id="haloGrad" cx="45%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#4F46E5" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Ambient blue halo -->
  <circle cx="256" cy="256" r="210" fill="url(#haloGrad)" />

  <!-- Main Symbol (Ribbon F) with subtle outer neon bloom -->
  <g filter="url(#outer-neon-glow)">
    
    <!-- 1. Inner dark recess fold (behind middle bar and bottom tail) -->
    <path d="M 166 268
             C 162 290, 164 316, 174 340
             C 188 322, 218 296, 268 266
             L 242 278
             C 198 298, 178 318, 166 340 Z"
          fill="url(#innerShadowGrad)" />

    <!-- 2. Bottom Folded Tail (Electric blue/violet facet pointing down-right) -->
    <path d="M 167 339
             C 170 354, 182 368, 200 378
             L 258 408
             C 270 414, 276 409, 276 397
             L 276 328
             L 236 307
             C 202 322, 178 333, 167 339 Z"
          fill="url(#bottomTailGrad)" />

    <!-- Bottom Tail Neon Glow Rim -->
    <path d="M 168 344
             C 178 358, 192 370, 206 378
             L 258 405
             C 268 410, 274 406, 274 397
             L 274 338"
          stroke="url(#bottomNeonRim)"
          stroke-width="3.5"
          stroke-linecap="round"
          fill="none" />

    <!-- 3. Middle Bar (Icy blue to white rounded ribbon arm) -->
    <path d="M 166 268
             C 168 252, 184 242, 210 230
             L 330 178
             C 346 171, 355 178, 356 193
             C 357 208, 348 222, 332 229
             L 216 280
             C 188 292, 172 312, 167 339
             C 162 316, 160 290, 166 268 Z"
          fill="url(#midBarGrad)" />

    <!-- Middle Bar Ridge Specular Highlight -->
    <path d="M 206 232
             L 330 177
             C 344 171, 352 176, 354 189"
          stroke="url(#midRidgeHighlight)"
          stroke-width="2.5"
          stroke-linecap="round"
          fill="none" />

    <!-- 4. Top Bar & Left Loop (White/icy-blue ribbon arm) -->
    <path d="M 166 268
             C 160 240, 158 210, 160 185
             C 163 155, 178 138, 202 126
             L 326 78
             C 342 71, 351 78, 352 93
             C 353 108, 344 122, 328 129
             L 204 180
             C 182 189, 170 205, 166 230
             L 166 268 Z"
          fill="url(#topBarGrad)" />

    <!-- Top Bar Ridge Specular Highlight -->
    <path d="M 198 128
             L 326 77
             C 340 71, 348 76, 350 89"
          stroke="url(#topRidgeHighlight)"
          stroke-width="3"
          stroke-linecap="round"
          fill="none" />

    <!-- Left Outer Curve Continuous Highlight -->
    <path d="M 166 268
             C 160 240, 158 210, 160 185
             C 163 155, 178 138, 202 126"
          stroke="#FFFFFF"
          stroke-width="2.5"
          stroke-linecap="round"
          fill="none"
          opacity="0.9" />
  </g>
</svg>