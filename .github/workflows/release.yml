name: FLOAT Studio Desktop Release

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'
    branches:
      - 'claude/phase1b-real-packaging'
  pull_request:
    branches:
      - 'main'
      - 'master'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

jobs:
  build-desktop:
    name: Package Desktop (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.platform == 'macos-arm64' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            os: ubuntu-latest
            artifact_name: float-studio_amd64.deb
            archive_name: FLOAT-linux-x64.tar.gz
          - platform: windows-x64
            os: windows-latest
            artifact_name: FLOAT-Setup-x64.exe
            archive_name: FLOAT-win32-x64.zip
          - platform: macos-arm64
            os: macos-14
            artifact_name: FLOAT-arm64.dmg
            archive_name: FLOAT-darwin-arm64.zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Build Web & Core Server Assets
        run: npm run build

      - name: Install Linux build prerequisites
        if: matrix.platform == 'linux-x64'
        run: sudo apt-get update && sudo apt-get install -y unzip xvfb

      - name: Install Inno Setup (Windows only)
        if: matrix.platform == 'windows-x64'
        run: choco install innosetup --no-progress -y

      - name: Package Desktop Artifacts (${{ matrix.platform }})
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_IDENTITY: ${{ secrets.APPLE_IDENTITY }}
        run: node scripts/packageDesktopRelease.cjs --platform=${{ matrix.platform }}

      - name: Validate Artifact Integrity & Minimum Sizes (> 20 MB)
        shell: bash
        run: |
          echo "Verifying generated release artifacts in dist/release/..."
          ls -lh dist/release/
          
          for artifact in "${{ matrix.artifact_name }}" "${{ matrix.archive_name }}"; do
            file_path="dist/release/$artifact"
            if [ ! -f "$file_path" ]; then
              echo "::error::Artifact $artifact was NOT created!"
              exit 1
            fi
            
            # Cross-platform size check in bytes
            file_size=$(node -e "console.log(require('fs').statSync('$file_path').size)")
            echo "Artifact $artifact is $file_size bytes ($(( file_size / 1024 / 1024 )) MB)"
            
            # Fail if under 20 MB (20,971,520 bytes)
            if [ "$file_size" -lt 20971520 ]; then
              echo "::error::Artifact $artifact is under minimum threshold of 20 MB! Detected placeholder or broken build."
              exit 1
            fi
          done

      - name: Upload Platform Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: dist/release/
          retention-days: 7

  smoke-test-desktop:
    name: Headless Smoke Test (${{ matrix.platform }})
    needs: build-desktop
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.platform == 'macos-arm64' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            os: ubuntu-latest
          - platform: windows-x64
            os: windows-latest
          - platform: macos-arm64
            os: macos-14

    steps:
      - name: Download platform artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: dist/release

      # -------------------------------------------------------------------------
      # Linux Smoke Test
      # -------------------------------------------------------------------------
      - name: Linux Smoke Test (Install .deb & Test Headless)
        if: matrix.platform == 'linux-x64'
        run: |
          echo "Installing system prerequisites..."
          sudo apt-get update
          sudo apt-get install -y xvfb libgtk-3-0 libnss3 libasound2 libxss1 libx11-xcb1 libsecret-1-0
          
          echo "Installing Debian package..."
          sudo dpkg -i dist/release/float-studio_amd64.deb || sudo apt-get -f install -y
          
          test -f /usr/share/float-studio/float-studio
          test -f /usr/share/applications/float-studio.desktop
          
          echo "Launching FLOAT Studio headless via xvfb-run (testing 15s stability)..."
          xvfb-run --auto-servernum timeout 15 /usr/share/float-studio/float-studio --no-sandbox --headless || [ $? -eq 124 ] || [ $? -eq 0 ]
          
          echo "Testing portable tar.gz unpack and execution..."
          mkdir -p tmp-tar && tar -xzf dist/release/FLOAT-linux-x64.tar.gz -C tmp-tar
          xvfb-run --auto-servernum timeout 15 ./tmp-tar/float-studio --no-sandbox --headless || [ $? -eq 124 ] || [ $? -eq 0 ]
          echo "Linux desktop artifacts passed all headless smoke tests."

      # -------------------------------------------------------------------------
      # Windows Smoke Test
      # -------------------------------------------------------------------------
      - name: Windows Smoke Test (Extract ZIP & Test Headless)
        if: matrix.platform == 'windows-x64'
        shell: powershell
        run: |
          Write-Host "Unpacking portable Windows ZIP..."
          Expand-Archive -Path dist/release/FLOAT-win32-x64.zip -DestinationPath tmp-win -Force
          $exe = "tmp-win/FLOAT.exe"
          if (-not (Test-Path $exe)) {
            throw "Executable $exe does not exist in portable bundle!"
          }
          
          Write-Host "Launching FLOAT.exe in headless verification mode..."
          $proc = Start-Process -FilePath $exe -ArgumentList "--headless", "--no-sandbox" -PassThru
          Start-Sleep -Seconds 12
          if ($proc.HasExited -and $proc.ExitCode -ne 0) {
            throw "FLOAT.exe crashed on launch with exit code $($proc.ExitCode)"
          }
          if (-not $proc.HasExited) {
            Stop-Process -Id $proc.Id -Force
            Write-Host "FLOAT.exe process PID $($proc.Id) ran stably and was terminated cleanly."
          }
          
          Write-Host "Verifying Inno Setup installer..."
          $installer = "dist/release/FLOAT-Setup-x64.exe"
          if (-not (Test-Path $installer)) {
            throw "Installer $installer does not exist!"
          }
          Write-Host "Windows desktop artifacts passed all smoke tests."

      # -------------------------------------------------------------------------
      # macOS Smoke Test
      # -------------------------------------------------------------------------
      - name: macOS Smoke Test (Mount DMG & Verify App Structure)
        if: matrix.platform == 'macos-arm64'
        run: |
          echo "Attaching DMG image..."
          hdiutil attach dist/release/FLOAT-arm64.dmg -mountpoint /Volumes/FLOAT-Studio
          
          echo "Verifying application bundle..."
          test -d "/Volumes/FLOAT-Studio/FLOAT Studio.app"
          test -f "/Volumes/FLOAT-Studio/FLOAT Studio.app/Contents/MacOS/FLOAT"
          test -f "/Volumes/FLOAT-Studio/FLOAT Studio.app/Contents/Info.plist"
          
          echo "Unmounting DMG..."
          hdiutil detach /Volumes/FLOAT-Studio
          echo "macOS desktop artifacts passed all smoke tests."

  create-github-release:
    name: Publish Release & Checksums
    needs: [build-desktop, smoke-test-desktop]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Generate SHA256SUMS.txt
        run: |
          cd release-assets
          find . -type f ! -name "SHA256SUMS.txt" -exec sha256sum {} + > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/**/*
          draft: false
          prerelease: false
          generate_release_notes: true
