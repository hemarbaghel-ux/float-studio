name: FLOAT Studio Desktop Release

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

jobs:
  build-desktop:
    name: Package Desktop (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            os: windows-latest
            artifact_name: FLOAT-Setup-x64.exe
            archive_name: FLOAT-win32-x64.zip
          - platform: macos-arm64
            os: macos-14
            artifact_name: FLOAT-arm64.dmg
            archive_name: FLOAT-darwin-arm64.zip
          - platform: linux-x64
            os: ubuntu-latest
            artifact_name: float-studio_amd64.deb
            archive_name: FLOAT-linux-x64.tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies (strict lockfile verification)
        run: npm ci --no-audit --no-fund

      - name: Build Web & Core Assets
        run: npm run build

      - name: Build native FLOAT utility-process entrypoint
        run: npm run build:float-daemon-worker

      - name: Build all built-in core language extensions
        run: npm run build:extensions

      - name: Block Incomplete Native Desktop Packaging
        shell: bash
        run: |
          echo "::error::Production desktop release is blocked: Native Code-OSS packaging is not ready."
          echo "FLOAT Studio requires compilation of the genuine Code-OSS desktop workbench and native installer packaging (Windows Inno Setup with VC++ runtime, macOS .app/.dmg with hardened runtime entitlements, Linux .deb with AppArmor profile)."
          echo "Packaging the React web bundle in a generic Electron shell is prohibited for production releases."
          echo "Genuine Code-OSS compilation and installer packaging are scheduled for Prompt 2."
          exit 1

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: dist/release/

  create-github-release:
    name: Publish Release & Checksums
    needs: build-desktop
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Generate SHA256SUMS
        run: |
          cd release-assets
          find . -type f ! -name "SHA256SUMS.txt" -exec sha256sum {} + > SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            release-assets/**/*
          draft: false
          prerelease: false
          generate_release_notes: true
