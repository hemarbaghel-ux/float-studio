name: FLOAT Studio Desktop Release

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'
    branches:
      - 'claude/phase1b-real-packaging'
  pull_request:
    branches:
      - 'main'
      - 'master'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

jobs:
  build-desktop:
    name: Package Desktop (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            os: ubuntu-latest
            artifact_name: float-studio_amd64.deb
            archive_name: FLOAT-linux-x64.tar.gz
          - platform: windows-x64
            os: windows-latest
            artifact_name: FLOAT-Setup-x64.exe
            archive_name: FLOAT-win32-x64.zip
          # Platform macos-arm64 (producing FLOAT-arm64.dmg and FLOAT-darwin-arm64.zip) is fully implemented
          # in scripts/packageDesktopRelease.cjs with hardened runtime entitlements and DMG/ZIP bundling.
          # It is currently disabled from active runner scheduling because GitHub Actions macOS runners are
          # unallocated on this account (resulting in immediate runner cancellation).

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Build Web & Core Server Assets
        run: npm run build

      - name: Install Linux build prerequisites
        if: matrix.platform == 'linux-x64'
        run: sudo apt-get update && sudo apt-get install -y unzip xvfb

      - name: Install Inno Setup (Windows only)
        if: matrix.platform == 'windows-x64'
        run: choco install innosetup --no-progress -y

      - name: Package Desktop Artifacts (${{ matrix.platform }})
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_IDENTITY: ${{ secrets.APPLE_IDENTITY }}
        run: node scripts/packageDesktopRelease.cjs --platform=${{ matrix.platform }}

      - name: Validate Artifact Integrity & Minimum Sizes (> 20 MB)
        shell: bash
        run: |
          echo "Verifying generated release artifacts in dist/release/..."
          ls -lh dist/release/
          
          for artifact in "${{ matrix.artifact_name }}" "${{ matrix.archive_name }}"; do
            file_path="dist/release/$artifact"
            if [ ! -f "$file_path" ]; then
              echo "::error::Artifact $artifact was NOT created!"
              exit 1
            fi
            
            # Cross-platform size check in bytes
            file_size=$(node -e "console.log(require('fs').statSync('$file_path').size)")
            echo "Artifact $artifact is $file_size bytes ($(( file_size / 1024 / 1024 )) MB)"
            
            # Fail if under 20 MB (20,971,520 bytes)
            if [ "$file_size" -lt 20971520 ]; then
              echo "::error::Artifact $artifact is under minimum threshold of 20 MB! Detected placeholder or broken build."
              exit 1
            fi
          done

      - name: Upload Platform Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: dist/release/
          retention-days: 7

  smoke-test-desktop:
    name: Headless Smoke Test (${{ matrix.platform }})
    needs: build-desktop
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            os: ubuntu-latest
          - platform: windows-x64
            os: windows-latest

    steps:
      - name: Download platform artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: dist/release

      # -------------------------------------------------------------------------
      # Linux Smoke Test
      # -------------------------------------------------------------------------
      - name: Linux Smoke Test (Install .deb, Verify AppArmor & Self-Check)
        if: matrix.platform == 'linux-x64'
        run: |
          echo "Installing system prerequisites..."
          sudo apt-get update
          sudo apt-get install -y xvfb libgtk-3-0 libnss3 libxss1 libx11-xcb1 libsecret-1-0
          sudo apt-get install -y libasound2t64 2>/dev/null || sudo apt-get install -y libasound2
          
          echo "Installing Debian package..."
          sudo dpkg -i dist/release/float-studio_amd64.deb || sudo apt-get -f install -y
          
          test -f /usr/share/float-studio/float-studio
          test -f /usr/share/applications/float-studio.desktop
          test -f /etc/apparmor.d/float-studio
          
          echo "Verifying and reloading AppArmor profile..."
          sudo apparmor_parser -r /etc/apparmor.d/float-studio || sudo apparmor_parser -r -T /etc/apparmor.d/float-studio
          echo "AppArmor profile successfully loaded."
          
          echo "Launching installed FLOAT Studio WITHOUT --no-sandbox (verifying AppArmor sandbox & --smoke-test self-check)..."
          xvfb-run --auto-servernum /usr/share/float-studio/float-studio --smoke-test
          echo "Linux desktop installed app started with sandbox enabled and passed startup self-check (exit code 0)."
          
          echo "Testing portable tar.gz unpack and execution..."
          mkdir -p tmp-tar && tar -xzf dist/release/FLOAT-linux-x64.tar.gz -C tmp-tar
          xvfb-run --auto-servernum ./tmp-tar/float-studio --smoke-test --no-sandbox
          echo "Linux desktop artifacts passed all headless smoke tests."

      # -------------------------------------------------------------------------
      # Windows Smoke Test
      # -------------------------------------------------------------------------
      - name: Windows Smoke Test (Install, Launch Installed App, Self-Check, Uninstall)
        if: matrix.platform == 'windows-x64'
        shell: powershell
        run: |
          $installer = "dist/release/FLOAT-Setup-x64.exe"
          if (-not (Test-Path $installer)) {
            throw "Installer $installer does not exist!"
          }
          
          Write-Host "Step 1: Running silent installation of FLOAT Studio..."
          $installProcess = Start-Process -FilePath $installer -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -PassThru -Wait
          if ($installProcess.ExitCode -ne 0) {
            throw "Inno Setup installer failed with exit code $($installProcess.ExitCode)"
          }
          Write-Host "Installer finished cleanly."

          # Determine install location (PrivilegesRequired=lowest installs to {localappdata}\Programs\FLOAT Studio)
          $installDirs = @(
            "$env:LOCALAPPDATA\Programs\FLOAT Studio",
            "$env:ProgramFiles\FLOAT Studio",
            "${env:ProgramFiles(x86)}\FLOAT Studio"
          )
          $installDir = $installDirs | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $installDir) {
            throw "Installation folder was not found! Checked: $($installDirs -join ', ')"
          }
          Write-Host "Confirmed installation folder exists: $installDir"

          $installedExe = Join-Path $installDir "FLOAT.exe"
          if (-not (Test-Path $installedExe)) {
            throw "Installed executable not found at: $installedExe"
          }
          Write-Host "Confirmed installed executable exists: $installedExe"

          # Confirm Start Menu shortcut
          $startMenuCandidates = @(
            "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\FLOAT Studio.lnk",
            "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\FLOAT Studio\FLOAT Studio.lnk",
            "$env:ProgramData\Microsoft\Windows\Start Menu\Programs\FLOAT Studio.lnk",
            "$env:ProgramData\Microsoft\Windows\Start Menu\Programs\FLOAT Studio\FLOAT Studio.lnk"
          )
          $startMenuShortcut = $startMenuCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $startMenuShortcut) {
            Get-ChildItem -Recurse "$env:APPDATA\Microsoft\Windows\Start Menu\Programs" -ErrorAction SilentlyContinue | Select-Object FullName
            throw "Start Menu entry was not found! Checked: $($startMenuCandidates -join ', ')"
          }
          Write-Host "Confirmed Start Menu entry exists: $startMenuShortcut"

          Write-Host "Step 2: Launching installed FLOAT.exe with --smoke-test (verifying 20s stability & self-check)..."
          $proc = Start-Process -FilePath $installedExe -ArgumentList "--smoke-test", "--no-sandbox" -PassThru
          Write-Host "Launched process PID $($proc.Id). Monitoring for 20 seconds..."
          
          # Monitor process status for 20 seconds
          $passedSelfCheck = $false
          for ($i = 0; $i -lt 20; $i++) {
            Start-Sleep -Seconds 1
            if ($proc.HasExited) {
              if ($proc.ExitCode -eq 0) {
                Write-Host "FLOAT.exe completed startup self-check successfully with exit code 0 at second $i."
                $passedSelfCheck = $true
                break
              } else {
                throw "FLOAT.exe crashed or exited with error code $($proc.ExitCode) at second $i!"
              }
            }
          }

          if (-not $proc.HasExited) {
            Write-Host "Process stayed alive for 20 seconds. Waiting for self-check clean exit..."
            $proc.WaitForExit(15000)
            if ($proc.ExitCode -eq 0) {
              $passedSelfCheck = $true
              Write-Host "FLOAT.exe completed startup self-check with exit code 0."
            } else {
              Stop-Process -Id $proc.Id -Force
              throw "FLOAT.exe did not complete self-check with code 0 (ExitCode: $($proc.ExitCode))."
            }
          }

          if (-not $passedSelfCheck) {
            throw "Startup self-check did not complete successfully."
          }
          Write-Host "Installed application confirmed alive and successfully passed startup self-check."

          Write-Host "Step 3: Running uninstaller and confirming cleanup..."
          $uninstaller = Join-Path $installDir "unins000.exe"
          if (-not (Test-Path $uninstaller)) {
            throw "Uninstaller not found at: $uninstaller"
          }
          $uninstProcess = Start-Process -FilePath $uninstaller -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -PassThru -Wait
          Start-Sleep -Seconds 6

          if (Test-Path $installedExe) {
            throw "FLOAT.exe still exists after uninstall at: $installedExe"
          }
          Write-Host "Confirmed FLOAT.exe was removed by the uninstaller."

          Write-Host "Step 4: Testing portable Windows ZIP unpack and --smoke-test..."
          Expand-Archive -Path dist/release/FLOAT-win32-x64.zip -DestinationPath tmp-win -Force
          $portableExe = "tmp-win/FLOAT.exe"
          $portProc = Start-Process -FilePath $portableExe -ArgumentList "--smoke-test", "--no-sandbox" -PassThru
          $portProc.WaitForExit(25000)
          if ($portProc.ExitCode -ne 0) {
            throw "Portable FLOAT.exe failed --smoke-test with exit code $($portProc.ExitCode)"
          }
          Write-Host "Portable ZIP confirmed passed startup self-check."
          Write-Host "Windows desktop artifacts passed all installer, launcher, self-check, and uninstaller smoke tests."

  create-github-release:
    name: Publish Release & Checksums
    needs: [build-desktop, smoke-test-desktop]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Generate SHA256SUMS.txt
        run: |
          cd release-assets
          find . -type f ! -name "SHA256SUMS.txt" -exec sha256sum {} + > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/**/*
          draft: false
          prerelease: false
          generate_release_notes: true
