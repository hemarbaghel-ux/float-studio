name: FLOAT Studio Desktop Release

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

jobs:
  build-desktop:
    name: Package Desktop (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            os: windows-latest
            artifact_name: FLOAT-Setup-x64.exe
            archive_name: FLOAT-win32-x64.zip
          - platform: macos-arm64
            os: macos-14
            artifact_name: FLOAT-arm64.dmg
            archive_name: FLOAT-darwin-arm64.zip
          - platform: linux-x64
            os: ubuntu-latest
            artifact_name: float-studio_amd64.deb
            archive_name: FLOAT-linux-x64.tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies (strict lockfile verification)
        run: npm ci --no-audit --no-fund

      - name: TypeScript static check (lint)
        run: npm run lint

      - name: Build Web, Server, Daemon Worker & Built-in Extensions
        run: |
          npm run build
          npm run build:float-daemon-worker
          npm run build:extensions

      - name: Package Real Desktop Installers & Portable Bundles
        shell: bash
        run: |
          node scripts/packageDesktopRelease.cjs --platform=${{ matrix.platform }}

      - name: Validate Binary Magic Headers & Minimum Artifact Sizes (>= 20 MB)
        shell: bash
        run: |
          node scripts/validateReleaseArtifacts.cjs --platform=${{ matrix.platform }}

      - name: Smoke-Test Packaged Desktop Binary
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" = "linux-x64" ]; then
            test -x dist/build-desktop-tmp/linux-unpacked/float-studio
            xvfb-run -a dist/build-desktop-tmp/linux-unpacked/float-studio --headless --no-sandbox
          elif [ "${{ matrix.platform }}" = "windows-x64" ]; then
            test -f dist/build-desktop-tmp/win-unpacked/FLOAT.exe
            ./dist/build-desktop-tmp/win-unpacked/FLOAT.exe --headless
          elif [ "${{ matrix.platform }}" = "macos-arm64" ]; then
            test -d "dist/build-desktop-tmp/mac-unpacked/FLOAT Studio.app"
            "dist/build-desktop-tmp/mac-unpacked/FLOAT Studio.app/Contents/MacOS/Electron" --headless
          fi

      - name: Upload Validated Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: dist/release/
          if-no-files-found: error

  create-github-release:
    name: Publish Release & Checksums
    needs: build-desktop
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Verify Downloaded Artifacts & Generate SHA256SUMS
        run: |
          cd release-assets
          for f in $(find . -type f ! -name "SHA256SUMS.txt"); do
            size=$(wc -c < "$f")
            if [ "$size" -lt 20971520 ]; then
              echo "ERROR: Release artifact $f is smaller than 20 MB ($size bytes). Refusing placeholder release."
              exit 1
            fi
          done
          find . -type f ! -name "SHA256SUMS.txt" -exec sha256sum {} + > SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            release-assets/**/*
          draft: false
          prerelease: false
          generate_release_notes: true
