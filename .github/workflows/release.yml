name: FLOAT Studio Desktop Release

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

jobs:
  build-desktop:
    name: Package Desktop (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            os: windows-latest
            artifact_name: FLOAT-Setup-x64.exe
            archive_name: FLOAT-win32-x64.zip
          - platform: macos-arm64
            os: macos-14
            artifact_name: FLOAT-arm64.dmg
            archive_name: FLOAT-darwin-arm64.zip
          - platform: linux-x64
            os: ubuntu-latest
            artifact_name: float-studio_amd64.deb
            archive_name: FLOAT-linux-x64.tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies (strict lockfile verification)
        run: npm ci --no-audit --no-fund

      - name: TypeScript static check (lint)
        run: npm run lint

      - name: Build Web, Server, Daemon Worker & Built-in Extensions
        run: |
          npm run build
          npm run build:float-daemon-worker
          npm run build:extensions
          npm run build:desktop-extensions

      - name: Block incomplete native desktop release
        shell: bash
        run: |
          echo "::error::Production desktop release is blocked until the genuine Code-OSS workbench and platform installers pass runtime acceptance."
          echo "The local Electron preview packager does not create a production FLOAT desktop IDE."
          echo "Required before release: compiled workbench, native module rebuilds, signed platform packages, installation tests, and real workbench launch smoke tests."
          exit 1

  create-github-release:
    name: Publish Release & Checksums
    needs: build-desktop
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Verify Downloaded Artifacts & Generate SHA256SUMS
        run: |
          cd release-assets
          for f in $(find . -type f ! -name "SHA256SUMS.txt"); do
            size=$(wc -c < "$f")
            if [ "$size" -lt 20971520 ]; then
              echo "ERROR: Release artifact $f is smaller than 20 MB ($size bytes). Refusing placeholder release."
              exit 1
            fi
          done
          find . -type f ! -name "SHA256SUMS.txt" -exec sha256sum {} + > SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            release-assets/**/*
          draft: false
          prerelease: false
          generate_release_notes: true
