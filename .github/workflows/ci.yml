name: FLOAT Studio CI

permissions:
  contents: read

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  verify:
    name: Typecheck, Security & Regression Suite, Production Build
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: '--max-old-space-size=4096'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies (strict lockfile verification)
        run: npm ci --no-audit --no-fund

      - name: TypeScript static check (lint)
        run: npm run lint

      - name: Production build (client + server bundles)
        run: npm run build

      - name: Build native FLOAT utility-process entrypoint
        run: npm run build:float-daemon-worker

      - name: Run full verification suite (Chat, Models, Persistence, Security)
        run: npm test
