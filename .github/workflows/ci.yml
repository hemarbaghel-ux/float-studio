name: FLOAT Studio CI

permissions:
  contents: read

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  verify:
    name: Typecheck, Security & Regression Suite, Production Build
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: '--max-old-space-size=4096'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies (npm ci)
        run: npm ci --no-audit --no-fund

      - name: Lint & Typecheck (tsc --noEmit)
        run: npm run lint

      - name: Core Flow Tests (Vitest)
        run: npm run test:vitest

      - name: Production Build (Client & Server Bundles)
        run: npm run build

      - name: Build native FLOAT utility-process entrypoint
        run: npm run build:float-daemon-worker

      - name: Build all built-in core language extensions
        run: npm run build:extensions

      - name: Prepare Composer sandbox image for integration tests
        run: docker pull node:22-bookworm-slim

      - name: Run Full Test Suite (Unit, Integration & Desktop)
        run: npm test
