name: FLOAT Studio CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  verify:
    name: Typecheck, Security & Regression Suite, Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript static check (lint)
        run: npm run lint

      - name: Run full verification suite (Chat, Models, Persistence, Security)
        run: npm test

      - name: Production build (client + server bundles)
        run: npm run build
