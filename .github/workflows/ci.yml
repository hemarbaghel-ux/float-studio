name: FLOAT Studio CI

permissions:
  contents: write

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  verify:
    name: Typecheck, Security & Regression Suite, Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Regenerate npm lockfile from cross-platform manifest
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Upload regenerated lockfile for finalization
        uses: actions/upload-artifact@v4
        with:
          name: ci-generated-package-lock
          path: package-lock.json
          if-no-files-found: error

      - name: Commit synchronized npm lockfile to same-repository PR branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(deps): regenerate cross-platform npm lockfile"
          AUTH_HEADER="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w 0)"
          git -c http.extraheader="AUTHORIZATION: basic $AUTH_HEADER" push origin "HEAD:$HEAD_REF"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: TypeScript static check (lint)
        run: npm run lint

      - name: Production build (client + server bundles)
        run: npm run build

      - name: Run full verification suite (Chat, Models, Persistence, Security)
        run: npm test
