name: FLOAT Composer Backend Verification

on:
  push:
    branches:
      - 'float/**'
      - 'main'
  pull_request:
    branches:
      - 'float/**'
      - 'main'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  composer-contract:
    name: Composer Structured-Tool Contract
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.18.2'
          cache: npm

      - name: Install root dependencies
        run: npm ci --ignore-scripts

      - name: Run Composer execution contract tests
        run: node node_modules/tsx/dist/cli.mjs scripts/testComposerExecutionService.ts

      - name: Run root TypeScript typecheck
        run: npm run lint
